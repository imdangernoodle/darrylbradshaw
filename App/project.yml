name: GlassSSH
options:
  bundleIdPrefix: com.darrylbradshaw
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    TARGETED_DEVICE_FAMILY: "2" # iPad only
    DEVELOPMENT_TEAM: "" # set your team in Xcode signing settings

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: "1.2.0"
  GlassSSHCore:
    path: ../Core

targets:
  GlassSSH:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: GlassSSH
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.darrylbradshaw.glassssh
        CODE_SIGN_ENTITLEMENTS: GlassSSH/GlassSSH.entitlements
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: GlassSSH/Info.plist
      properties:
        CFBundleDisplayName: GlassSSH
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Scan QR codes to import SSH connections and pair with hosts."
        NSLocalNetworkUsageDescription: "Discover SSH servers advertised on your local network via Bonjour."
        NSBonjourServices:
          - _ssh._tcp
          - _glasspair._tcp
    dependencies:
      - package: SwiftTerm
      - package: GlassSSHCore
        product: GlassSSHCore
      - package: GlassSSHCore
        product: GlassSSHNet
